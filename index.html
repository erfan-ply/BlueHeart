<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>I love you &lt;3</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #000;
  }
  #play {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    border: 1px solid rgba(100,190,255,.45);
    border-radius: 999px;
    padding: 10px 18px;
    color: #dff7ff;
    background: rgba(0, 25, 50, .65);
    backdrop-filter: blur(8px);
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<!-- Put love_you.mp3 in the same folder as this index.html if you want music. -->
<audio id="music" src="love_you.mp3" loop preload="auto"></audio>
<button id="play">▶ Play music</button>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");
const play = document.getElementById("play");

const words = ["love you", "Love You", "LOVE YOU"];
const colors = [
  [70,130,180],
  [30,144,255],
  [0,191,255],
  [100,149,237],
  [65,105,225]
];

let W, H, dpr;
let particles = [];
let startTime = performance.now();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * dpr);
  canvas.height = Math.floor(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  createParticles();
}
window.addEventListener("resize", resize);

function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return {x, y};
}

function createParticles() {
  particles = [];

  // More particles on larger screens, fewer on phones.
  const count = Math.max(260, Math.min(620, Math.floor(W * H / 2300)));

  // Outline + several interior layers.
  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;
    const p = heartPoint(t);

    // Scale based on the smaller dimension, keeping the heart proportional.
    const scale = Math.min(W, H) * 0.022;
    let x = W/2 + p.x * scale;
    let y = H/2 - p.y * scale;

    // Some particles are pushed inward to create the filled heart effect.
    if (i % 3 !== 0) {
      const fill = Math.random() * 0.78;
      x = W/2 + p.x * scale * fill;
      y = H/2 - p.y * scale * fill;
    }

    particles.push({
      x, y,
      delay: Math.random() * 4200,
      size: 8 + Math.random() * 6,
      alpha: 0.35 + Math.random() * 0.65,
      phase: Math.random() * Math.PI * 2,
      speed: 0.8 + Math.random() * 1.8,
      word: words[Math.floor(Math.random() * words.length)],
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function drawGlowText(text, x, y, size, rgb, alpha, glow) {
  ctx.save();
  ctx.font = `bold ${size}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.shadowColor = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
  ctx.shadowBlur = glow;
  ctx.fillStyle = `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function animate(now) {
  const elapsed = now - startTime;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);

  for (const p of particles) {
    const local = elapsed - p.delay;
    if (local < 0) continue;

    const appear = Math.min(1, local / 500);
    const pulse = 0.72 + 0.28 * Math.sin(now * 0.002 * p.speed + p.phase);
    const a = p.alpha * appear * pulse;

    const c = p.color;
    drawGlowText(p.word, p.x, p.y, p.size, c, a, 7 + 8*pulse);
  }

  // Center text appears after the heart has mostly formed.
  const centerDelay = 4300;
  const centerIn = Math.max(0, Math.min(1, (elapsed-centerDelay)/900));
  if (centerIn > 0) {
    const pulse = 1 + 0.06 * Math.sin(now * 0.003);
    const size = Math.min(W, H) * 0.065 * pulse;
    drawGlowText(
      "Love You",
      W/2,
      H/2,
      Math.max(22, size),
      [125, 205, 255],
      centerIn,
      20 + 15*Math.sin(now*0.003)
    );
  }

  requestAnimationFrame(animate);
}

play.addEventListener("click", async () => {
  try {
    if (music.paused) {
      await music.play();
      play.textContent = "⏸ Pause music";
    } else {
      music.pause();
      play.textContent = "▶ Play music";
    }
  } catch {
    play.textContent = "Music file not found";
  }
});

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
